in:15px 0}.err{font-size:12px;color:#a02820;font-weight:bold;margin-top:3px;min-height:16px}.actions{display:flex;justify-content:space-between;gap:14px;margin-top:24px;flex-wrap:wrap}.review-row,.detail-row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #edf2ef}.review-row span:first-child,.detail-row span:first-child{color:var(--sub)}.review-row strong,.detail-row strong{text-align:right;max-width:65%;overflow-wrap:anywhere}.review-row:last-child,.detail-row:last-child{border:0}.success-icon{height:65px;width:65px;background:var(--mint);border-radius:50%;display:grid;place-items:center;color:#184d40;font-weight:bold;font-size:35px;margin:0 0 14px}.toolbar{display:flex;gap:10px;margin:0 0 20px}.toolbar input{flex:1;min-width:70px}.toolbar select{width:auto;min-width:150px}.two-cols{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}.timeline{border-left:2px solid #c8ded5;padding:0 0 0 18px;margin:14px 0 0 8px}.timeline-item{position:relative;margin-bottom:19px;font-size:12px}.timeline-item:before{content:'';position:absolute;left:-25px;top:3px;width:11px;height:11px;border:2px solid #7eaba4;border-radius:100%;background:white}.timeline-item b{display:block}.timeline-item small{color:var(--sub)}.footer-note{text-align:center;color:#62716a;font-size:11px;margin:26px 0 0}.reset{color:#34594e;background:transparent;border:0;text-decoration:underline;padding:0;font-size:11px}.mobile-nav{display:none}.pill-top{font-size:10px;background:#e7f3ed;border:1px solid #b9d4c8;padding:4px 8px;border-radius:15px;color:#315b50;font-weight:700}

<div class="layout"><aside class="sidebar"><div class="nav-label">NAVEGACIÓN</div><nav id="side-nav" aria-label="Navegación principal"></nav><div class="notice"><strong>Entorno de demostración</strong><br>Las solicitudes son ficticias y se guardan solo en este navegador. No existe conexión con servidores de la empresa.<br><br><button class="reset" id="reset">Reiniciar datos de prueba</button></div></aside><main id="app" tabindex="-1" aria-live="polite"></main></div><nav class="mobile-nav" id="mobile-nav" aria-label="Navegación móvil"></nav>
<script>
(function(){'use strict';
const KEY='b78_support_prototype_v1';
const demo=[{id:'B78-001',device:'Notebook de oficina · B78-014',category:'Conectividad',description:'El equipo se desconecta de Wi-Fi durante las reuniones.',status:'En revisión',created:'15/11/2026',notes:'Solicitud recibida; pendiente de diagnóstico.'},{id:'B78-002',device:'Equipo de escritorio · B78-021',category:'Software',description:'La aplicación de trabajo no abre correctamente.',status:'Finalizado',created:'13/11/2026',notes:'Se revisó la aplicación. Caso de demostración.'}];
let tickets;try{tickets=JSON.parse(localStorage.getItem(KEY))}catch(e){tickets=null}if(!Array.isArray(tickets))tickets=demo;
let role='worker',page='home',step=0,selected=null,filter='',query='',draft={device:'',category:'',description:''};
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(tickets))}catch(e){}};
const statusClass=s=>s==='En revisión'?'review':s==='En atención'?'attend':s==='Finalizado'?'done':'';
const statusTag=s=>`<span class="status ${statusClass(s)}">${esc(s)}</span>`;
const nav=role==='worker'?[['home','Inicio','⌂'],['new','Nueva solicitud','＋'],['mine','Mis solicitudes','▤']]:[['home','Inicio','⌂'],['technical','Panel técnico','▥'],['mine','Solicitudes','▤']];
const icons={home:'<svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v11H3z"/><path d="M9 21v-7h6v7"/></svg>',new:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',mine:'<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',technical:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></svg>'};
function navRender(){const html=nav.map(([id,label,icon])=>`<button class="nav-btn ${page===id||page==='detail'&&id==='mine'?'active':''}" data-page="${id}">${icons[id]} ${label}</button>`).join('');$('side-nav').innerHTML=html;$('mobile-nav').innerHTML=nav.map(([id,label,icon])=>`<button class="${page===id||page==='detail'&&id==='mine'?'active':''}" data-page="${id}"><span>${icon}</span>${label}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));}
function head(kicker,title,subtitle,extra=''){return `<div class="page-title"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${subtitle}</p></div>${extra}</div>`}
function go(p){page=p;if(p==='new'){step=0;draft={device:'',category:'',description:''}}render();window.scrollTo(0,0)}
function render(){if(role==='tech'&&page==='new')page='technical';navRender();let html='';switch(page){case'home':html=home();break;case'new':html=wizard();break;case'mine':html=list(false);break;case'technical':html=list(true);break;case'detail':html=detail();break;case'confirmation':html=confirmation();break;default:html=home()}$('app').innerHTML=html;bind();}
function home(){const count=tickets.filter(t=>t.status!=='Finalizado').length;return head('PORTAL DE ASISTENCIA','Bienvenido a Soporte Bulnes78',role==='worker'?'Registra problemas con tu equipo y revisa el estado de tus solicitudes.':'Consulta los requerimientos y actualiza sus estados.')+`<div class="hero"><div><h2>${role==='worker'?'¿Necesitas ayuda con tu equipo?':'Gestiona solicitudes desde un solo lugar'}</h2><p>${role==='worker'?'Te acompañamos paso a paso para registrar tu solicitud de mantenimiento.':'Revisa las incidencias reportadas y mantén informado a cada trabajador.'}</p><button class="btn primary" data-go="${role==='worker'?'new':'technical'}">${role==='worker'?'＋ Crear solicitud':'Ver panel técnico'} →</button></div><div class="hero-symbol" aria-hidden="true">${role==='worker'?'?':'✓'}</div></div><div class="statgrid"><div class="stat"><div class="num">${tickets.length}</div><div class="lbl">Solicitudes totales</div></div><div class="stat"><div class="num">${count}</div><div class="lbl">En proceso</div></div><div class="stat"><div class="num">${tickets.filter(t=>t.status==='Finalizado').length}</div><div class="lbl">Finalizadas</div></div></div>`+table(tickets.slice(0,3),'Solicitudes recientes');}
function table(items,title){return `<section class="card"><div class="card-head"><h3>${title}</h3><button class="btn secondary sm" data-go="${role==='tech'?'technical':'mine'}">Ver todas →</button></div>${items.length?`<div class="table-wrap"><table class="tickets-table"><thead><tr><th>Folio</th><th>Problema</th><th>Fecha</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${items.map(t=>`<tr><td><strong>${esc(t.id)}</strong></td><td>${esc(t.category)}</td><td>${esc(t.created)}</td><td>${statusTag(t.status)}</td><td><button data-open="${esc(t.id)}">Ver detalle</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Todavía no hay solicitudes registradas.</div>'}</section>`}
function wizard(){const labels=['Equipo','Problema','Revisión'];let body='';if(step===0){body=`<h2>¿Qué equipo necesita asistencia?</h2><p>Selecciona el dispositivo asociado al problema.</p><div class="field" style="margin-top:23px"><label for="device">Equipo informático *</label><select id="device"><option value="">Seleccionar equipo</option><option>Notebook de oficina · B78-014</option><option>Equipo de escritorio · B78-021</option><option>Otro equipo de la empresa</option></select><small>Los equipos son ejemplos ficticios para esta demostración.</small></div><div class="err" id="error" role="alert"></div>`}else if(step===1){body=`<h2>Cuéntanos qué sucede</h2><p>No necesitas conocer términos técnicos. Describe el problema con tus propias palabras.</p><div class="field" style="margin-top:23px"><label for="category">Tipo de problema *</label><select id="category"><option value="">Seleccionar categoría</option><option>Conectividad</option><option>Software</option><option>Hardware</option><option>Lentitud</option><option>Otro</option></select></div><div class="field"><label for="description">Descripción del problema *</label><textarea id="description" placeholder="Ejemplo: Mi notebook pierde la conexión a internet al iniciar una reunión."></textarea><small>Describe qué sucede y cuándo ocurre (mínimo 10 caracteres).</small></div><div class="err" id="error" role="alert"></div>`}else{body=`<h2>Revisa los antecedentes</h2><p>Verifica la información antes de enviar la solicitud.</p><div style="margin-top:22px"><div class="review-row"><span>Equipo</span><strong>${esc(draft.device)}</strong></div><div class="review-row"><span>Tipo de problema</span><strong>${esc(draft.category)}</strong></div><div class="review-row"><span>Descripción</span><strong>${esc(draft.description)}</strong></div></div><div class="hint">Al confirmar, se generará un número de seguimiento de demostración.</div>`}
return head('NUEVA SOLICITUD','Registrar incidencia','Completa las etapas del asistente para solicitar asistencia técnica.')+`<section class="card"><div class="stepper">${labels.map((x,i)=>`<div class="step ${i<step?'done':i===step?'active':''}"></div>`).join('')}</div><div class="step-captions">${labels.map((x,i)=>`<div class="step-caption ${i===step?'on':''}">${i+1}. ${x}</div>`).join('')}</div>${body}<div class="actions"><button class="btn secondary" id="back">${step===0?'Cancelar':'← Anterior'}</button><button class="btn primary" id="next">${step===2?'Confirmar y enviar':'Continuar →'}</button></div></section>`}
function list(tech){const filtered=tickets.filter(t=>(!filter||t.status===filter)&&(!query||`${t.id} ${t.category} ${t.device} ${t.description}`.toLowerCase().includes(query.toLowerCase())));return head(tech?'GESTIÓN TÉCNICA':'SEGUIMIENTO',tech?'Panel técnico':'Mis solicitudes',tech?'Consulta los requerimientos y gestiona los estados de atención.':'Revisa el avance de tus solicitudes de soporte.',tech?'':`<button class="btn primary" data-go="new">＋ Nueva solicitud</button>`)+`<div class="toolbar"><input id="search" type="search" placeholder="Buscar folio, equipo o problema" aria-label="Buscar solicitudes" value="${esc(query)}"><select id="filter" aria-label="Filtrar por estado"><option value="">Todos los estados</option>${['Recibida','En revisión','En atención','Finalizado'].map(s=>`<option ${s===filter?'selected':''}>${s}</option>`).join('')}</select></div>`+tableFiltered(filtered,tech)}
function tableFiltered(items,tech){return `<section class="card"><div class="card-head"><h3>${tech?'Solicitudes recibidas':'Historial de solicitudes'}</h3><span class="pill-top">${items.length} resultados</span></div>${items.length?`<div class="table-wrap"><table class="tickets-table"><thead><tr><th>Folio</th><th>Equipo</th><th>Problema</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${items.map(t=>`<tr><td><strong>${esc(t.id)}</strong></td><td>${esc(t.device)}</td><td>${esc(t.category)}</td><td>${statusTag(t.status)}</td><td><button data-open="${esc(t.id)}">${tech?'Gestionar':'Ver'}</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No se encontraron solicitudes con estos filtros.</div>'}</section>`}
function detail(){let t=tickets.find(t=>t.id===selected);if(!t){page='mine';return list(false)}let techn=role==='tech';return head('DETALLE DE SOLICITUD',esc(t.id),`Registrada el ${esc(t.created)} · ${esc(t.category)}`,`<button class="btn secondary sm" data-go="${techn?'technical':'mine'}">← Volver</button>`)+`<div class="two-cols"><section class="card"><div class="card-head"><h3>Antecedentes</h3>${statusTag(t.status)}</div><div class="detail-row"><span>Equipo afectado</span><strong>${esc(t.device)}</strong></div><div class="detail-row"><span>Categoría</span><strong>${esc(t.category)}</strong></div><div class="detail-row"><span>Descripción</span><strong>${esc(t.description)}</strong></div><div class="hint" style="margin-top:20px">${techn?'Desde aquí puedes cambiar el estado y añadir una observación.':'Aquí puedes consultar las actualizaciones realizadas por soporte.'}</div>${techn?`<div class="field"><label for="update">Actualizar estado</label><select id="update">${['Recibida','En revisión','En atención','Finalizado'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="note">Observación para el trabajador</label><textarea id="note" placeholder="Ej.: Revisaremos la conexión del equipo.">${esc(t.notes||'')}</textarea></div><button class="btn primary" id="save-update">Guardar actualización</button><p id="saved" role="status"></p>`:''}</section><section class="card"><h3>Seguimiento</h3><div class="timeline"><div class="timeline-item"><b>Solicitud registrada</b><small>${esc(t.created)}</small></div><div class="timeline-item"><b>Estado actual</b><small>${esc(t.status)}</small></div><div class="timeline-item"><b>Observaciones</b><small>${esc(t.notes||'Aún no hay observaciones.')}</small></div></div></section></div>`}
function confirmation(){const t=tickets.find(t=>t.id===selected);return `<section class="card" style="max-width:730px;margin:25px auto"><div class="success-icon" aria-hidden="true">✓</div><div class="eyebrow">SOLICITUD REGISTRADA</div><h1>¡Tu solicitud fue enviada!</h1><p>Se generó un identificador de seguimiento. Puedes consultar el estado desde «Mis solicitudes».</p><div class="hint" style="margin-top:25px">Folio de demostración: <strong>${esc(selected)}</strong><br>Estado inicial: <strong>Recibida</strong></div><div class="actions"><button class="btn secondary" data-go="home">Volver al inicio</button><button class="btn primary" data-open="${esc(selected)}">Ver seguimiento →</button></div></section>`}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.open;go('detail')}));if(page==='new'){if(step===0){$('device').value=draft.device;$('device').addEventListener('change',e=>draft.device=e.target.value)}if(step===1){$('category').value=draft.category;$('description').value=draft.description;$('category').addEventListener('change',e=>draft.category=e.target.value);$('description').addEventListener('input',e=>draft.description=e.target.value)}$('back').onclick=()=>step===0?go('home'):(step--,render());$('next').onclick=()=>{if(step===0&&!draft.device){$('error').textContent='Selecciona el equipo antes de continuar.';$('device').focus();return}if(step===1&&(!draft.category||draft.description.trim().length<10)){$('error').textContent='Selecciona una categoría y escribe una descripción de al menos 10 caracteres.';(!draft.category?$('category'):$('description')).focus();return}if(step===2){const n=Math.max(2,...tickets.map(t=>parseInt(t.id.split('-')[1])||0))+1;let d=new Date();let dt=`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;const t={id:`B78-${String(n).padStart(3,'0')}`,device:draft.device,category:draft.category,description:draft.description.trim(),status:'Recibida',created:dt,notes:'Solicitud recibida. En espera de revisión.'};tickets.unshift(t);selected=t.id;save();page='confirmation';render()}else{step++;render()}}}if(page==='mine'||page==='technical'){$('search').addEventListener('input',e=>{query=e.target.value;let pos=e.target.selectionStart;render();$('search').focus();$('search').setSelectionRange(pos,pos)});$('filter').addEventListener('change',e=>{filter=e.target.value;render()})}if(page==='detail'&&role==='tech'){$('save-update').addEventListener('click',()=>{const t=tickets.find(x=>x.id===selected);t.status=$('update').value;t.notes=$('note').value.trim();save();render();$('saved').textContent='Actualización guardada en esta demostración.'})}}
$('role').addEventListener('change',e=>{role=e.target.value;page='home';render()});$('reset').addEventListener('click',()=>{if(confirm('¿Restablecer las solicitudes ficticias del prototipo?')){tickets=JSON.parse(JSON.stringify(demo));save();query='';filter='';go('home')}});render();
})();
</script></body></html>
